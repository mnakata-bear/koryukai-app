<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>事業所名鑑</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3452D9">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="事業所名鑑">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#F3F5F8;
    --surface:#FFFFFF;
    --surface-2:#EAEDF3;
    --surface-3:#DDE1E9;
    --text:#1A1E28;
    --text-muted:#5B6475;
    --text-faint:#8891A0;
    --border:#DFE3EA;
    --accent:#3452D9;
    --accent-ink:#FFFFFF;
    --accent-soft:#E9EDFF;
    --pri-a:#0E8577;
    --pri-a-soft:#E1F4F0;
    --pri-b:#A9690A;
    --pri-b-soft:#FBF0D9;
    --pri-c:#6C58AC;
    --pri-c-soft:#EFEAFB;
    --pri-d:#5C6B7A;
    --pri-d-soft:#E7EBEF;
    --pri-none:#8992A3;
    --pri-none-soft:#EDEFF3;
    --danger:#B8402E;
    --shadow:0 1px 2px rgba(20,24,32,.06),0 10px 26px -14px rgba(20,24,32,.22);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#11141B;
      --surface:#1A1E28;
      --surface-2:#212633;
      --surface-3:#2B3040;
      --text:#E7E9F0;
      --text-muted:#9BA3B7;
      --text-faint:#6E7690;
      --border:#2A2F40;
      --accent:#7C93FF;
      --accent-ink:#0E1220;
      --accent-soft:#212A47;
      --pri-a:#3FCBB2;
      --pri-a-soft:#153531;
      --pri-b:#E7B356;
      --pri-b-soft:#3A2C10;
      --pri-c:#B3A1EE;
      --pri-c-soft:#2A2450;
      --pri-d:#93A2B5;
      --pri-d-soft:#232B36;
      --pri-none:#8791A8;
      --pri-none-soft:#212633;
      --danger:#E28677;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#11141B;
    --surface:#1A1E28;
    --surface-2:#212633;
    --surface-3:#2B3040;
    --text:#E7E9F0;
    --text-muted:#9BA3B7;
    --text-faint:#6E7690;
    --border:#2A2F40;
    --accent:#7C93FF;
    --accent-ink:#0E1220;
    --accent-soft:#212A47;
    --pri-a:#3FCBB2;
    --pri-a-soft:#153531;
    --pri-b:#E7B356;
    --pri-b-soft:#3A2C10;
    --pri-c:#B3A1EE;
    --pri-c-soft:#2A2450;
    --pri-d:#93A2B5;
    --pri-d-soft:#232B36;
    --pri-none:#8791A8;
    --pri-none-soft:#212633;
    --danger:#E28677;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  [hidden]{display:none!important;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 18px 12px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .topbar h1{
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic Medium",sans-serif;
    font-weight:900;
    font-size:19px;
    letter-spacing:.01em;
    margin:0;
    color:var(--text);
  }
  .topbar .sub{
    font-size:11.5px;
    color:var(--text-faint);
    font-weight:500;
  }
  main{
    flex:1 1 auto;
    padding:0 0 92px;
  }
  section.view{padding:16px 18px 8px;}
  h2.section-title{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--text-muted);
    margin:20px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  h2.section-title:first-child{margin-top:2px;}

  /* search + filters */
  .search-wrap{
    position:sticky;
    top:53px;
    z-index:15;
    background:var(--bg);
    padding:14px 18px 10px;
    border-bottom:1px solid var(--border);
  }
  .search-field{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 12px;
    box-shadow:var(--shadow);
  }
  .search-field svg{flex:none;color:var(--text-faint);}
  .search-field input{
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:16px;
    width:100%;
  }
  .search-field input::placeholder{color:var(--text-faint);}
  .chips{
    display:flex;
    gap:7px;
    margin-top:10px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .chip{
    flex:none;
    display:flex;
    align-items:center;
    gap:5px;
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:12.5px;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
  }
  .chip .n{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    opacity:.75;
  }
  .chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .chip.active .n{opacity:.85;}
  .chip[data-p="A"].active{background:var(--pri-a);border-color:var(--pri-a);}
  .chip[data-p="B"].active{background:var(--pri-b);border-color:var(--pri-b);}
  .chip[data-p="C"].active{background:var(--pri-c);border-color:var(--pri-c);}
  .chip[data-p="D"].active{background:var(--pri-d);border-color:var(--pri-d);}
  .chip[data-p="none"].active{background:var(--pri-none);border-color:var(--pri-none);}

  .group-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin:20px 18px 8px;
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:13.5px;
    color:var(--text-muted);
  }
  .group-header .gdot{width:9px;height:9px;border-radius:50%;flex:none;}
  .group-header .gcount{
    margin-left:auto;
    font-family:"JetBrains Mono",monospace;
    font-weight:500;
    font-size:11.5px;
    color:var(--text-faint);
  }

  /* list */
  .list{display:flex;flex-direction:column;gap:9px;padding:14px 18px 4px;}
  .card{
    display:flex;
    align-items:stretch;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 14px;
    text-align:left;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .card .stripe{width:5px;border-radius:4px;flex:none;background:var(--pri-none);opacity:.55;}
  .card.pA .stripe,.card.pB .stripe,.card.pC .stripe,.card.pD .stripe{opacity:1;}
  .card.pA .stripe{background:var(--pri-a);}
  .card.pB .stripe{background:var(--pri-b);}
  .card.pC .stripe{background:var(--pri-c);}
  .card.pD .stripe{background:var(--pri-d);}
  .card-body{flex:1 1 auto;min-width:0;}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
  .talk-check{
    flex:none;
    width:21px;height:21px;
    margin-left:auto;
    border-radius:50%;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:transparent;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .talk-check.checked{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  .talk-toggle{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:13px;
    margin-bottom:14px;
    cursor:pointer;
  }
  .talk-toggle.checked{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }
  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:11px;
  }
  .toggle-row label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--text-muted);
    cursor:pointer;
  }
  .toggle-row input[type="checkbox"]{
    accent-color:var(--accent);
    width:15px;height:15px;
  }
  .progress-stat{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    color:var(--text-faint);
  }
  .no-tag{
    font-family:"JetBrains Mono",monospace;
    font-weight:700;
    font-size:11px;
    color:var(--text-faint);
  }
  .pbadge{
    font-family:"JetBrains Mono",monospace;
    font-weight:700;
    font-size:11px;
    width:21px;
    height:21px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  .pbadge.A{background:var(--pri-a-soft);color:var(--pri-a);}
  .pbadge.B{background:var(--pri-b-soft);color:var(--pri-b);}
  .pbadge.C{background:var(--pri-c-soft);color:var(--pri-c);}
  .pbadge.D{background:var(--pri-d-soft);color:var(--pri-d);}
  .card-name{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:16.5px;
    color:var(--text);
    margin:0 0 3px;
  }
  .card-biz{
    font-size:14px;
    color:var(--text-muted);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    line-height:1.5;
  }
  .card-chev{
    align-self:center;
    color:var(--text-faint);
    flex:none;
  }
  .note-flag{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:10.5px;
    color:var(--accent);
    margin-top:4px;
    font-weight:600;
  }
  .empty{
    padding:40px 18px;
    text-align:center;
    color:var(--text-faint);
    font-size:14.5px;
    line-height:1.8;
  }

  /* detail */
  .detail{padding:8px 18px 8px;}
  .back-btn{
    position:sticky;
    top:53px;
    z-index:12;
    display:flex;
    align-items:center;
    gap:5px;
    width:calc(100% + 36px);
    margin:0 -18px 4px;
    background:var(--bg);
    border:none;
    color:var(--accent);
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:8px 18px 10px;
    cursor:pointer;
  }
  .detail-head{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-bottom:16px;
  }
  .detail-head .tags{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .detail-name{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:900;
    font-size:22px;
    line-height:1.35;
    margin:0;
    text-wrap:balance;
  }
  .field{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .field .label{
    font-family:"JetBrains Mono",monospace;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.06em;
    color:var(--text-faint);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .field .val{font-size:16.5px;line-height:1.75;color:var(--text);white-space:pre-wrap;}
  .field .val a{color:var(--accent);word-break:break-all;}
  .field.eval{background:var(--surface-2);}
  .field.followup{background:var(--surface-2);}
  .field.followup .followup-toggle{margin-bottom:10px;}
  .field.proposal{background:var(--accent-soft);border-color:transparent;}
  .field.proposal .label{color:var(--accent);}
  .estimate-details{margin-top:12px;}
  .estimate-summary{
    display:flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
    list-style:none;
    font-family:"JetBrains Mono",monospace;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.05em;
    color:var(--accent);
    -webkit-user-select:none;
    user-select:none;
  }
  .estimate-summary::-webkit-details-marker{display:none;}
  .estimate-summary::before{
    content:"";
    width:0;height:0;
    flex:none;
    border-left:4px solid var(--accent);
    border-top:3.5px solid transparent;
    border-bottom:3.5px solid transparent;
    transition:transform .15s ease;
  }
  .estimate-details[open] .estimate-summary::before{transform:rotate(90deg);}
  .estimate-val{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--border);
    font-size:14.5px;
    line-height:1.75;
    color:var(--text);
    white-space:pre-wrap;
  }
  .field.strategy{
    border-color:transparent;
  }
  .field.strategy.A{background:var(--pri-a-soft);}
  .field.strategy.B{background:var(--pri-b-soft);}
  .field.strategy.C{background:var(--pri-c-soft);}
  .field.strategy.D{background:var(--pri-d-soft);}
  .field.strategy .label{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .field.strategy .plabel{
    font-family:"Zen Kaku Gothic New",sans-serif;
    text-transform:none;
    font-weight:700;
    font-size:14px;
  }
  .field.strategy.A .plabel{color:var(--pri-a);}
  .field.strategy.B .plabel{color:var(--pri-b);}
  .field.strategy.C .plabel{color:var(--pri-c);}
  .field.strategy.D .plabel{color:var(--pri-d);}
  .field.strategy .sub-label{
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    color:var(--text-faint);
    margin:10px 0 4px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .field.strategy .sub-label:first-of-type{margin-top:2px;}

  textarea.memo-input{
    width:100%;
    min-height:88px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--bg);
    color:var(--text);
    font-family:inherit;
    font-size:16px;
    line-height:1.6;
    padding:10px 12px;
    outline:none;
  }
  textarea.memo-input:focus{border-color:var(--accent);}
  .memo-save-state{
    font-size:11px;
    color:var(--text-faint);
    margin-top:6px;
    height:14px;
  }

  /* schedule tab */
  .timeline{position:relative;padding-left:22px;margin:4px 0 6px;}
  .timeline::before{
    content:"";
    position:absolute;
    left:5px;top:6px;bottom:6px;
    width:2px;
    background:var(--border);
  }
  .round{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .round::before{
    content:"";
    position:absolute;
    left:-22px;top:18px;
    width:12px;height:12px;
    border-radius:50%;
    background:var(--accent);
    border:2px solid var(--bg);
  }
  .round-title{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:15.5px;
    margin:0 0 10px;
  }
  .agenda-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    padding:7px 0;
    border-top:1px solid var(--border);
    font-size:14.5px;
  }
  .agenda-row.first{border-top:none;}
  .agenda-row .t{
    font-family:"JetBrains Mono",monospace;
    font-size:11.5px;
    color:var(--text-faint);
    flex:none;
    padding-top:1px;
  }
  .agenda-row .d{color:var(--text);text-align:right;}
  .agenda-row .d b{font-weight:700;}
  button.agenda-row{
    width:100%;
    border:none;
    background:none;
    margin:0;
    font:inherit;
    color:inherit;
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
    border-radius:8px;
  }
  .agenda-row.agenda-click:active{background:var(--surface-2);}
  .chev{flex:none;color:var(--text-faint);margin-top:2px;display:inline-flex;}
  .prep-hint{
    display:block;
    margin-top:4px;
    font-size:11px;
    color:var(--accent);
    font-weight:600;
  }
  .prep-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px 16px 2px;
    margin-bottom:8px;
    box-shadow:var(--shadow);
  }
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(10,12,18,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-sheet{
    width:100%;
    max-width:520px;
    max-height:min(76vh,76dvh);
    overflow-y:auto;
    background:var(--surface);
    border-radius:18px;
    padding:16px 18px 18px;
    box-shadow:0 16px 44px rgba(0,0,0,.32);
  }
  @media (prefers-reduced-motion:no-preference){
    .modal-sheet{ animation:sheetIn .16s ease-out; }
  }
  @keyframes sheetIn{
    from{ transform:scale(.96); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  .modal-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
  }
  .modal-head h3{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:17px;
    line-height:1.4;
    margin:0;
    text-wrap:balance;
  }
  .modal-close{
    flex:none;
    width:30px;height:30px;
    border-radius:9px;
    border:none;
    background:var(--surface-2);
    color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .modal-textarea{min-height:220px;}
  .modal-view-text{
    font-size:16px;
    line-height:1.85;
    color:var(--text);
    white-space:pre-wrap;
    margin-bottom:18px;
  }
  .modal-view-empty{
    font-size:14.5px;
    color:var(--text-faint);
    line-height:1.7;
    margin-bottom:18px;
  }
  .modal-edit-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:11px;
    border-radius:12px;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .modal-actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:2px;
  }
  .modal-done-btn{
    flex:none;
    padding:9px 20px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
  }
  .move-note{
    text-align:center;
    color:var(--text-faint);
    font-size:12px;
    margin:2px 0 12px;
    position:relative;
  }
  .part2{
    background:var(--accent-soft);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:8px;
  }
  .part2 .round-title{color:var(--accent);}
  .tips{
    list-style:none;
    margin:0;
    padding:0;

    DATA = ev.data;
    strategyMap = {};
    DATA.strategy.forEach(function(s){ strategyMap[s.no] = s; });
    notes = loadNotes(ev.id);
    prep = {};
    if(ev.prepDefaults){
      for(var k in ev.prepDefaults){ prep[k] = ev.prepDefaults[k]; }
    }
    var savedPrep = loadPrep(ev.id);
    for(var k2 in savedPrep){ prep[k2] = savedPrep[k2]; }
    talked = loadTalked(ev.id);
    followed = loadFollowup(ev.id);
    state.screen = "app";
    state.eventId = ev.id;
    state.tab = "search";
    state.query = "";
    state.filter = "all";
    state.selectedNo = null;
    state.modalKey = null;
    state.modalEditing = false;
    state.hideTalked = false;
    render();

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function priorityOf(no){
    var s = strategyMap[no];
    return s ? s.priority : null;
  }

  function counts(){

  function filteredCompanies(){
    var q = state.query.trim();
    return DATA.companies.filter(function(co){
      if(state.filter !== "all"){
        var p = priorityOf(co.no) || "none";
        if(p !== state.filter) return false;
      }
      if(state.hideTalked && talked[co.no]) return false;
      if(!q) return true;
      var hay = co.name + " " + co.biz + " " + co.wish;
      return hay.indexOf(q) !== -1;
    });

    html += '  <p class="export-desc">当日フリーメモ・準備メモ・事業所別メモをまとめてテキストにします。終了後の振り返りやお礼連絡にどうぞ。</p>';
    html += '  <button class="export-btn" id="exportBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="10" height="4" rx="1"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/></svg><span id="exportBtnLabel">メモを書き出す（コピー）</span></button>';
    html += '</div>';

    html += '</section>';
    return html;
  }

  function buildExportText(){
    var lines = [];
    lines.push((currentEvent.name)+"（"+formatDate(currentEvent.date)+"）メモ");
    lines.push("");
    var fm = loadFreeMemo(state.eventId);
    if(fm && fm.trim()){
      lines.push("■ 当日フリーメモ");
      lines.push(fm.trim());
      lines.push("");
    }
    if(prep.selfintro && prep.selfintro.trim()){
      lines.push("■ 自己紹介");
      lines.push(prep.selfintro.trim());
      lines.push("");
    }
    var topicLabels = {
      topic0:"自社のイチオシを教えてください",
      topic1:"最近、仕事でやってよかったこと",
      topic2:"こんな人とつながりたい！"
    };
    var topicLines = [];
    ["topic0","topic1","topic2"].forEach(function(k){
      if(prep[k] && prep[k].trim()){
        topicLines.push("・"+topicLabels[k]);
        topicLines.push("  "+prep[k].trim());
      }
    });
    if(topicLines.length){
      lines.push("■ ディスカッション準備");
      lines = lines.concat(topicLines);
      lines.push("");
    }
    if(prep.freetime && prep.freetime.trim()){
      lines.push("■ フリータイムの動き方");
      lines.push(prep.freetime.trim());
      lines.push("");
    }
    var noteLines = [];
    DATA.companies.forEach(function(co){
      var t = notes[co.no];
      if(t && t.trim()){
        noteLines.push("No."+co.no+" "+co.name);
        noteLines.push("  "+t.trim());
      }
    });
    if(noteLines.length){
      lines.push("■ 事業所別メモ");
      lines = lines.concat(noteLines);
    }
    while(lines.length && lines[lines.length-1] === ""){ lines.pop(); }
    return lines.join("\n");
  }

  function fallbackCopy(text){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(e){
      return false;
    }
  }

  function copyTextToClipboard(text, onDone){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ onDone(true); }, function(){ onDone(fallbackCopy(text)); });
    }else{
      onDone(fallbackCopy(text));
    }
  }

  function copyExport(){
    var text = buildExportText();
    var label = document.getElementById("exportBtnLabel");
    copyTextToClipboard(text, function(ok){
      if(!label) return;
      label.textContent = ok ? "コピーしました" : "コピーできませんでした（手動で選択してください）";
      setTimeout(function(){
        if(label) label.textContent = "メモを書き出す（コピー）";
      }, 2200);
    });
  }

  function buildFollowUpEmail(co){
    var lines = [];
    lines.push(co.name+" 御中");
    lines.push("");
    lines.push("お世話になっております。");
    lines.push("株式会社BearsSystemの［お名前］です。");
    lines.push("");
    lines.push("先日は交流会にて貴重なお時間をいただき、誠にありがとうございました。");
    lines.push("［当日お話しした内容を一言添える］");
    lines.push("");
    lines.push("またぜひ詳しくお話しできる機会をいただけますと幸いです。");
    lines.push("今後ともどうぞよろしくお願いいたします。");
    lines.push("");
    lines.push("株式会社BearsSystem");
    lines.push("［お名前］");
    return lines.join("\n");
  }

  function copyFollowupEmail(no){
    var co = DATA.companies.filter(function(c){ return c.no === no; })[0];
    if(!co) return;
    var text = buildFollowUpEmail(co);
    var label = document.getElementById("followupEmailLabel_"+no);
    copyTextToClipboard(text, function(ok){
      if(!label) return;
      label.textContent = ok ? "コピーしました" : "コピーできませんでした";
      setTimeout(function(){
        if(label) label.textContent = "お礼メール文面をコピー";
      }, 2200);
    });
  }

  function bindDynamic(){
    var q = document.getElementById("q");
    if(q){
      q.addEventListener("input", function(){
        state.query = q.value;
        var list = filteredCompanies();
        var wrap = main.querySelector(".list") || main.querySelector(".empty");
        // simplest: re-render just the results area by re-rendering whole search view but keep focus
        var pos = q.selectionStart;
        main.innerHTML = renderSearch();
        bindDynamic();
        var q2 = document.getElementById("q");
        if(q2){ q2.focus(); q2.setSelectionRange(pos, pos); }
      });
    }
    document.querySelectorAll(".chip").forEach(function(ch){
      ch.addEventListener("click", function(){
        state.filter = ch.dataset.filter;
        render();
      });
    });
    document.querySelectorAll("[data-open]").forEach(function(el){
      el.addEventListener("click", function(){
        state.selectedNo = parseInt(el.dataset.open, 10);
        state.tab = "search";
        render();
        main.scrollTop = 0;
        window.scrollTo(0,0);
      });
      el.addEventListener("keydown", function(ev){
        if(ev.key === "Enter" || ev.key === " "){
          ev.preventDefault();
          el.click();
        }
      });
    });
    document.querySelectorAll("[data-talk]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var no = parseInt(el.dataset.talk, 10);
        talked[no] = !talked[no];
        saveTalked(state.eventId, talked);
        render();
      });
    });
    document.querySelectorAll("[data-followup]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var no = parseInt(el.dataset.followup, 10);
        followed[no] = !followed[no];
        saveFollowup(state.eventId, followed);
        render();
      });
    });
    document.querySelectorAll("[data-emailgen]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var no = parseInt(el.dataset.emailgen, 10);
        copyFollowupEmail(no);
      });
    });
    var hideTalkedCb = document.getElementById("hideTalkedCheckbox");
    if(hideTalkedCb){
      hideTalkedCb.addEventListener("change", function(){
        state.hideTalked = hideTalkedCb.checked;
        render();
      });
    }
    var exportBtn = document.getElementById("exportBtn");
    if(exportBtn){
      exportBtn.addEventListener("click", copyExport);
    }
    document.querySelectorAll("[data-event]").forEach(function(el){
      el.addEventListener("click", function(){
        var ev = EVENTS.filter(function(e){ return e.id === el.dataset.event; })[0];
        if(ev) enterEvent(ev);
      });
    });
    document.querySelectorAll("[data-toggle]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.modalKey = btn.dataset.toggle;
        state.modalEditing = false;
        render();
      });
    });
    function flushActivePrepEdit(){
      if(state.modalKey && state.modalEditing){
        var ta = document.getElementById("prepInput_"+state.modalKey);
        if(ta){
          prep[state.modalKey] = ta.value;
          savePrep(state.eventId, prep);
        }
      }
    }
    var modalBackdrop = document.getElementById("modalBackdrop");
    if(modalBackdrop){
      modalBackdrop.addEventListener("click", function(ev){
        if(ev.target === modalBackdrop){
          flushActivePrepEdit();
          state.modalKey = null;
          state.modalEditing = false;
          render();
        }
      });
    }
    var modalCloseBtn = document.getElementById("modalCloseBtn");
    if(modalCloseBtn){
      modalCloseBtn.addEventListener("click", function(){
        flushActivePrepEdit();
        state.modalKey = null;
        state.modalEditing = false;
        render();
      });
    }
    var modalEditBtn = document.getElementById("modalEditBtn");
    if(modalEditBtn){
      modalEditBtn.addEventListener("click", function(){
        state.modalEditing = true;
        render();
        var ta = document.getElementById("prepInput_"+state.modalKey);
        if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      });
    }
    var modalDoneBtn = document.getElementById("modalDoneBtn");
    if(modalDoneBtn){
      modalDoneBtn.addEventListener("click", function(){
        flushActivePrepEdit();
        state.modalEditing = false;
        render();
      });
    }
    document.querySelectorAll(".prep-input").forEach(function(ta){
      var pt;
      ta.addEventListener("input", function(){
        clearTimeout(pt);
        var key = ta.dataset.prepkey;
        var val = ta.value;
        var st = document.getElementById("prepSaveState_"+key);
        if(st) st.textContent = "保存中…";
        pt = setTimeout(function(){
          prep[key] = val;
          savePrep(state.eventId, prep);
          if(st) st.textContent = "保存しました";
        }, 350);
      });
    });
    var back = document.getElementById("backBtn");
    if(back){
      back.addEventListener("click", function(){
        state.selectedNo = null;
        render();
      });
    }
    var noteInput = document.getElementById("noteInput");
    if(noteInput){
      var t;
      noteInput.addEventListener("input", function(){
        clearTimeout(t);
        var val = noteInput.value;
        var st = document.getElementById("saveState");
        if(st) st.textContent = "保存中…";
        t = setTimeout(function(){
          notes[state.selectedNo] = val;
          saveNotes(state.eventId, notes);
          if(st) st.textContent = "保存しました";
        }, 350);
      });
    }
    var freeMemoInput = document.getElementById("freeMemoInput");
    if(freeMemoInput){
      var t2;
      freeMemoInput.addEventListener("input", function(){
        clearTimeout(t2);
        var val = freeMemoInput.value;
        var st2 = document.getElementById("freeSaveState");
        if(st2) st2.textContent = "保存中…";
        t2 = setTimeout(function(){
          saveFreeMemo(state.eventId, val);
          if(st2) st2.textContent = "保存しました";
        }, 350);
      });
    }
  }

  document.querySelectorAll(".tab-btn").forEach(function(b){
    b.addEventListener("click", function(){
      state.tab = b.dataset.tab;
      if(state.tab !== "search"){ state.selectedNo = null; }
      render();
      window.scrollTo(0,0);
    });
  });

  homeBtn.addEventListener("click", backToHome);

  render();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
